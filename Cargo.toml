[package]
name = "docforge"
version = "0.1.0"
edition = "2021"
description = "通用文档解析：统一块级 IR + 格式路由 + PDF 页级混合路由（文字层直提 / OCR），OCR 与翻译友好输出"
license = "MIT OR Apache-2.0"
keywords = ["document", "parser", "ocr", "ir", "pdf"]
categories = ["parser-implementations", "text-processing"]
# 发布面收敛：本地工具/溯源 tarball（NOTICES 有 URL）/过程文档/大 fixture
# 不进 crate（真件金测在仓库跑，包内优雅 skip）
exclude = [".claude", "vendor", "docparse-plan.md", "docforge-spec-*.md", "tests/fixtures/chm"]

[features]
default = ["md", "csv", "html", "rtf"]
md = ["dep:pulldown-cmark"]
csv = []
html = []
rtf = []
# TXT 中文编码链（GB18030/Big5 回退；中文场景推荐开启）
encoding = ["dep:encoding_rs", "dep:chardetng"]
# to_json / to_json_pretty emit（cli 需要）
json = ["dep:serde_json"]
# 语言检测处理能力（whatlang，翻译管线源语言）
lang-detect = ["dep:whatlang"]
# pdf 页级路由（pdf-inspector default 面 = 纯 Rust：lopdf，无 ort/pyo3/pdfium；
# Auto/On 模式的引擎注入需要 ocr trait，image 依赖与 ocr 重叠）
pdf = ["dep:pdf-inspector", "dep:image", "ocr"]
# OCR 引擎抽象（trait + 类型）
ocr = ["dep:image"]
# oar-ocr 默认引擎（重依赖 ort 隔离于此；含 pdf 路由接线）
ocr-oar = ["ocr", "pdf", "dep:oar-ocr"]
# DOCX（docparser-office 吸收：zip + quick-xml 流式）
docx = ["dep:zip", "dep:quick-xml", "dep:md-5", "dep:log"]
# EPUB（docparser-epub 吸收：spine/OPF + HTML 块化，依赖 html 插件）
epub = ["dep:zip", "dep:quick-xml", "html"]
# XLSX/PPTX（docparser-office 吸收；xlsx 含 chrono 日期单元格）
xlsx = ["dep:chrono", "dep:md-5", "dep:quick-xml", "dep:zip", "dep:log"]
pptx = ["dep:md-5", "dep:quick-xml", "dep:zip", "dep:log"]
# DjVu（djvu-rs 0.44：文字层直提 + 无字页渲染接 OCR；否决 djvu 0.1.0——GPL）
djvu = ["dep:djvu-rs", "ocr"]
# FB2（document-parser fb2 loader 吸收：单 XML 电子书；fb2.zip 解包内层 .fb2）
fb2 = ["dep:quick-xml", "dep:base64", "dep:zip"]
# 图像直读（png/jpg 等单图即文档：字节透传 + ocr-images 图→文链）
image-files = ["dep:image", "ocr"]
# CHM（Microsoft 帮助文档：libchm 纯 Rust 读 + .hhc 阅读序 + #SYSTEM 元数据）
chm = ["dep:libchm", "html"]
# 压缩包容器（zip/rar/7z 内层文本多页合并；rar 走纯 Rust rars，7z 走 sevenz-rust2）
archive = ["dep:zip", "dep:rars", "dep:sevenz-rust2"]
# CBZ（漫画压缩包：字节透传，OCR 链消费位；M5）
cbz = ["dep:zip", "dep:image"]
# MOBI（Kindle 电子书：mobi-rs 读 MOBI7 正文 HTML，azw3/KF8 不支持；M5）
mobi = ["dep:mobi", "html"]
# ODF 家族（docparser-odf 吸收）
odt = ["dep:quick-xml", "dep:zip"]
ods = ["dep:quick-xml", "dep:zip"]
odp = ["dep:quick-xml", "dep:zip"]
odf = ["odt", "ods", "odp"]

[dependencies.zip]
version = "9"
features = ["deflate-flate2-zlib-rs"]
default-features = false
optional = true

[dependencies.quick-xml]
version = "0.42"
features = ["serialize"]
optional = true

[dependencies.md-5]
version = "0.10"
optional = true

[dependencies.log]
version = "0.4"
optional = true

[dependencies.libchm]
version = "0.3.1"
optional = true

[dependencies.rars]
version = "0.12.3"
default-features = false
optional = true

[dependencies.sevenz-rust2]
version = "0.24"
default-features = false
features = ["util"]
optional = true

[dependencies.pulldown-cmark]
version = "0.13"
default-features = false
optional = true

[dependencies.base64]
version = "0.23"
optional = true

[dependencies.djvu-rs]
version = "0.44"
default-features = false
features = ["std"]
optional = true

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["std"]
optional = true

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.encoding_rs]
version = "0.8"
optional = true

[dependencies.chardetng]
version = "0.1"
optional = true

[dependencies.serde_json]
version = "1"
optional = true

[dependencies.whatlang]
version = "0.18"
optional = true

[dependencies.pdf-inspector]
version = "1"
default-features = false
optional = true

[dependencies.image]
version = "0.25"
optional = true

[dependencies.mobi]
version = "0.8"
optional = true

# oar-ocr 必须 git 版：crates.io 0.1.1 是旧版，没有 auto-download（rumi 实测同款结论）
[dependencies.oar-ocr]
git = "https://github.com/GreatV/oar-ocr"
features = ["auto-download"]
optional = true

[[example]]
name = "pdf_dump"
path = "examples/pdf_dump.rs"
required-features = ["pdf"]

[[bin]]
name = "docforge-cli"
path = "src/bin/docforge-cli.rs"
required-features = ["json"]

[dev-dependencies]
serde_json = "1"
oxidize-pdf = "5"
